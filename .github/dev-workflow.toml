# Configuração do fluxo de desenvolvimento (skill dev-workflow).
# Referência de todas as chaves: .claude/skills/dev-workflow/references/configuration.md
# Confira com: python3 .claude/skills/dev-workflow/scripts/bootstrap.py doctor
schema = 1

[repository]
default_branch = "main"
# Branches em que um push pode publicar versão. `release/*` são linhas de manutenção.
release_branches = ["main", "release/*"]

# --- Tipos de issue ----------------------------------------------------------------------------
# Cada issue tem exatamente um destes labels. `prefixes` são os prefixos de commit e de branch;
# `level` é o incremento de versão que o tipo pede; `section` é a seção do changelog.

[types.bug]
color = "d73a4a"
description = "Comportamento incorreto ou regressão"
prefixes = ["fix"]
level = "patch"
section = "fixes"

[types.feature]
color = "1d76db"
description = "Nova funcionalidade"
prefixes = ["feat"]
level = "minor"
section = "features"

[types.enhancement]
color = "a2eeef"
description = "Melhoria de funcionalidade existente"
prefixes = ["feat", "perf"]
level = "minor"
section = "improvements"

[types.documentation]
color = "0075ca"
description = "Somente documentação"
prefixes = ["docs"]
level = "none"
section = "docs"

[types.refactor]
color = "fbca04"
description = "Reestruturação sem mudança de comportamento"
prefixes = ["refactor"]
level = "none"
section = "maintenance"

[types.test]
color = "bfd4f2"
description = "Somente testes, fixtures ou evidência de verificação"
prefixes = ["test"]
level = "none"
section = "maintenance"

[types.ci]
color = "5319e7"
description = "Pipeline e checks automáticos"
prefixes = ["ci"]
level = "none"
section = "maintenance"

[types.chore]
color = "c5def5"
description = "Dependências, ferramentas e configuração de desenvolvimento"
prefixes = ["chore", "build"]
level = "none"
section = "maintenance"

[labels.extra.security]
color = "b60205"
description = "Impacto em autenticação, tokens, dados de saúde, atualização assinada ou segredos"

# As mesmas seções da suíte (sk_med_core): toda entrega diz o que muda em segurança e no contrato
# do AGENTS.md.
[issues.sections]
default = [
    "Contexto",
    "Objetivo",
    "Escopo",
    "Abordagem técnica",
    "Critérios de aceite",
    "Plano de testes",
    "Documentação a atualizar",
    "Segurança e contrato do AGENTS.md",
    "Riscos e dependências",
    "Definição de pronto",
]
bug = [
    "Comportamento observado",
    "Comportamento esperado",
    "Passos para reproduzir",
    "Escopo",
    "Abordagem técnica",
    "Critérios de aceite",
    "Plano de testes",
    "Documentação a atualizar",
    "Segurança e contrato do AGENTS.md",
    "Riscos e dependências",
    "Definição de pronto",
]
documentation = ["Contexto", "Objetivo", "Critérios de aceite", "Definição de pronto"]

[pr]
required_sections = [
    "Issues",
    "Resumo",
    "Testes executados",
    "Documentação",
    "Segurança e contrato do AGENTS.md",
    "Versão",
]
# Quem abre PR sem passar pelo fluxo de issues.
exempt_authors = ["dependabot[bot]"]

[pr.severity]
# error bloqueia o check, warning só avisa, off desliga.
unchecked_criteria = "warning" # critérios de aceite sem marcar na issue fechada pelo PR
issue_sections = "warning"     # seção do modelo faltando na issue
type_mismatch = "warning"      # tipo do título diferente do tipo da issue

# --- Versão ------------------------------------------------------------------------------------

[versioning]
enabled = true
tag_prefix = "v"
# Vale só enquanto não existe tag de versão; depois a fonte é a última tag.
initial_version = "0.0.0"
# Em 0.x a quebra de compatibilidade sobe o minor; "strict" a leva direto a 1.0.0.
zero_major = "breaking-is-minor"
# true: mudança em superfície pública só é publicada com análise registrada ou sobreposição.
require_analysis = false

# Onde a versão é escrita. `search` é texto literal com {current}; a troca padrão põe {new} no
# lugar. Use `regex` + `replace` quando o texto não contém a versão corrente inteira.
# Marcadores: {current} {new} e, para cada um, _pep440 _core _major _minor _patch _next_minor _next_major.
# A versão do app é a do [workspace.package] do Cargo.toml, herdada pelos seis crates do app
# (`version.workspace = true`). A linha do Cargo.toml é ancorada para não casar com a versão de
# uma dependência; no Cargo.lock, cada crate tem a sua entrada, ancorada pelo nome (o arquivo usa
# LF, garantido pelo .gitattributes). O xtask tem versão fixa e fica de fora.
[[versioning.files]]
path = "Cargo.toml"
regex = '(?m)^version = "{current}"$'
replace = 'version = "{new}"'

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita\"\nversion = \"{current}\""

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita_api\"\nversion = \"{current}\""

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita_auth\"\nversion = \"{current}\""

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita_platform\"\nversion = \"{current}\""

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita_ui\"\nversion = \"{current}\""

[[versioning.files]]
path = "Cargo.lock"
search = "name = \"medvita_updater\"\nversion = \"{current}\""

# Contratos com o servidor do Medvita: o protocolo de atualização (envelope assinado, política,
# layout dos arquivos) e o contrato de login. Mudá-los pede análise; removê-los, major.
[[versioning.public_surfaces]]
name = "Protocolo de atualização"
globs = [
    "docs/updates.md",
    "crates/medvita_updater/src/envelope.rs",
    "crates/medvita_updater/src/canonical.rs",
    "crates/medvita_updater/src/policy.rs",
    "crates/medvita_updater/src/source.rs",
]

[[versioning.public_surfaces]]
name = "Contrato de login com o servidor"
globs = ["docs/authentication.md", "crates/medvita_auth/src/discovery.rs", "crates/medvita_auth/src/login.rs"]

# Versões que o código declara como piso ("disponível desde"). A release nunca sai menor que elas.
# [[versioning.floors]]
# globs = ["src/**/*.py"]
# regex = 'since="(\d+\.\d+\.\d+)"'

[changelog]
path = "CHANGELOG.md"
# Seções que ficam fora do arquivo (as notas da release sempre mostram todas).
hide = []

[release]
# "direct": o workflow commita na branch e publica. "pull-request": abre um PR de release, e a
# publicação acontece quando ele é mesclado (para branch protegida).
mode = "direct"
commit_message = "chore(release): {tag}"
# Como marcar PRs e issues incluídos numa versão.
mark = ["comment", "milestone"]
# Workflow a disparar depois da release (por exemplo "publish.yml"), com os inputs version e tag.
dispatch_workflow = "publish.yml"
